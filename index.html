<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harvey’s</title>
  <!-- 1.60.0: a taste-test link (#n=…&k=…) from before the move opens on rate.html, at once -->
  <script>if (/(?:^#|&)k=[A-Za-z0-9_-]/.test(location.hash)) location.replace('rate.html' + location.hash);</script>
  <meta name="description" content="What should I cook right now, from what I already have, that I’ll actually make?">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Harvey’s">
  <meta property="og:title" content="Harvey’s">
  <meta property="og:description" content="What you’ll actually cook tonight, from what’s already in your kitchen.">
  <meta property="og:image" content="https://pranjalparashar1.github.io/harveys/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Harvey’s: what will you actually cook tonight?">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Harvey’s">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97757'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' text-anchor='middle' fill='%23fff'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/rung-quiz.css">
  <link rel="stylesheet" href="assets/home.css">
</head>
<body class="home">
  <main class="shell hm" id="app" aria-busy="true">

    <!-- First visit: three ways in (1.60.0) -->
    <section class="hm-view hm-welcome" id="welcome" hidden>
      <p class="hm-eyebrow">Harvey’s</p>
      <h1 class="hm-title">What will you actually cook tonight?</h1>
      <p class="hm-error" id="welcome-error" role="alert" hidden></p>
      <div class="hm-paths">
        <button class="hm-path primary" id="go-scan" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <b>Scan your kitchen</b><span>Photos or a short video</span>
        </button>
        <button class="hm-path" id="go-persona" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
          <b>Start from a kitchen like yours</b><span>Pick one, then make it yours</span>
        </button>
      </div>
      <details class="hm-paste" id="paste">
        <summary>Paste a list, or use your own AI app</summary>
        <div class="hm-paste-in">
          <textarea id="paste-text" rows="6" placeholder="eggs&#10;paneer, butter, bread&#10;pressure cooker" aria-label="Kitchen items, one per line or comma-separated"></textarea>
          <button class="btn primary wide" id="paste-go" type="button">Use this list</button>
          <div class="hm-ai">
            <button class="btn" id="copy-prompt" type="button">Copy the prompt</button>
            <div class="hm-ai-links" id="ai-links">
              <a class="btn ghost" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>
              <a class="btn ghost" href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini</a>
              <a class="btn ghost" href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a>
            </div>
          </div>
        </div>
      </details>
    </section>

    <!-- Scan: photos or a short video (1.61.0: free, no key needed, once the relay has scan on) -->
    <section class="hm-view hm-scan" id="scan-view" hidden>
      <header class="hm-bar">
        <button class="rq-icon" id="scan-back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <p class="hm-eyebrow">Scan</p>
        <span class="rq-icon ghost"></span>
      </header>
      <h1 class="hm-title sm">Photograph or film your shelves, fridge and stove</h1>
      <div class="pickers">
        <label class="dropzone" for="photo-input">
          <input id="photo-input" type="file" accept="image/*,video/*" multiple>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
          <span class="dz-title">Photos or video</span>
        </label>
        <label class="dropzone" for="camera-input">
          <input id="camera-input" type="file" accept="image/*" capture="environment">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span class="dz-title">Camera</span>
        </label>
      </div>
      <ul class="thumbs" id="thumbs"></ul>
      <p class="mini" id="photo-status" aria-live="polite"></p>
      <!-- Your own AI key: shown when the free scan is off or used up -->
      <div class="hm-key" id="key-box" hidden>
        <label class="field">
          <span>Your AI key</span>
          <input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…, sk-ant-… or sk-…">
        </label>
        <p class="detected" id="detected"></p>
        <button class="btn" id="save-key" type="button" disabled>Save key</button>
      </div>
      <div class="hm-key-saved" id="key-saved" hidden>
        <span class="dot" aria-hidden="true"></span><span id="key-name"></span>
        <button class="btn link quiet" id="change-key" type="button">Change</button>
      </div>
      <p class="hm-error" id="scan-error" role="alert" hidden></p>
      <button class="btn link" id="scan-fallback" type="button" hidden>Start from a kitchen like yours</button>
      <div class="hm-foot">
        <button class="btn primary xl wide" id="scan" type="button" disabled>Scan</button>
      </div>
    </section>

    <!-- Home: the saved kitchen's effort ladder, straight away -->
    <section class="hm-view hm-home" id="home" hidden>
      <header class="hm-top">
        <p class="hm-eyebrow">Harvey’s</p>
        <button class="hm-pill" id="open-kitchen" type="button" aria-haspopup="dialog">My kitchen <b id="kitchen-count">0</b></button>
        <button class="hm-pill" id="rescan" type="button">Rescan</button>
      </header>
      <h1 class="hm-title" id="home-title">Pick your effort</h1>
      <div class="segmented hm-kind" id="kind" role="radiogroup" aria-label="Meal or snack">
        <button type="button" role="radio" data-value="meal" aria-checked="true">Meal</button>
        <button type="button" role="radio" data-value="snack" aria-checked="false">Snack</button>
      </div>
      <div class="hm-soaked" id="soaked-wrap" hidden>
        <p class="hm-label">Soaked today</p>
        <div class="hm-chips" id="soaked"></div>
      </div>
      <div id="ladder" aria-live="polite"></div>
      <div id="extras"></div>
    </section>

    <footer class="sig hm-sig" id="sig"><span id="version">1.62.0</span><a href="owner.html">pranjal</a></footer>
  </main>

  <!-- My kitchen: untick what ran out, add what's new, back it up -->
  <dialog class="hm-sheet" id="kitchen-sheet" aria-labelledby="sheet-title">
    <div class="hm-sheet-in">
      <header class="hm-sheet-top">
        <h2 id="sheet-title">My kitchen</h2>
        <button class="btn link" id="sheet-done" type="button">Done</button>
      </header>
      <form class="rq-add rq-find hm-find" id="find-form" role="search">
        <input id="find" type="search" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" placeholder="Add more" aria-label="Add more: search foods and cookware">
      </form>
      <div class="hm-found" id="found" aria-live="polite"></div>
      <div id="sheet-items"></div>
      <div class="hm-sheet-actions">
        <button class="btn wide" id="recheck" type="button">Check it all again</button>
        <button class="btn wide" id="copy-backup" type="button">Copy backup link</button>
        <input class="hm-backup" id="backup-out" type="text" readonly hidden aria-label="Backup link">
        <button class="btn link quiet hm-forget" id="forget-kitchen" type="button">Start over</button>
      </div>
    </div>
  </dialog>

  <!-- After Cooked this -->
  <div class="hm-ranout" id="ranout" role="region" aria-label="Ran out?" hidden></div>

  <script type="module" src="src/home.js"></script>
</body>
</html>
