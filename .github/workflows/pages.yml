name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Taste tests sent from the phone land here; a new data file needs no redeploy.
    paths-ignore: ['data/kitchen-tests/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the static site
        run: |
          mkdir -p _site
          cp -r index.html train.html pierre.html tutor.html retest.html bench.html prep.html test.html assets src _site/
          mkdir -p _site/data && cp -r data/test-kitchens _site/data/
          # Unique URLs per build, so a phone never mixes old and new files
          node scripts/stamp.mjs _site "${GITHUB_SHA::12}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
