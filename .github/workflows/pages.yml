name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Taste tests and live cook logs sent from phones land here; a new data file needs no redeploy.
    paths-ignore: ['data/kitchen-tests/**', 'data/cook-logs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the static site
        run: |
          mkdir -p _site
          cp -r index.html rate.html owner.html train.html pierre.html tutor.html retest.html bench.html prep.html test.html share.html assets src _site/
          mkdir -p _site/data && cp -r data/test-kitchens _site/data/
          # Unique URLs per build, so a phone never mixes old and new files
          node scripts/stamp.mjs _site "${GITHUB_SHA::12}"
          # Which build is live, so an old cached page can notice and reload (src/fresh.js)
          echo "{\"build\":\"${GITHUB_SHA::12}\"}" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub sometimes can't see a just-uploaded artifact yet (23 Nov: 1.46.0 never went
      # live because of this). Wait and try once more rather than leave the old site up.
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
