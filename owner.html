<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harvey’s workbench</title>
  <meta name="description" content="pranjal’s Harvey’s: the full app, debug, share links and training.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97757'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' text-anchor='middle' fill='%23fff'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="src/gate.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/rung-quiz.css">
</head>
<body>
  <main class="shell">
    <header class="hero hero-row">
      <h1>Harvey</h1>
      <a class="btn link hero-link" href="./">Tester view</a>
    </header>
    <!-- Everything pranjal uses, one tap away (1.35.0) -->
    <nav class="hub" aria-label="Pages">
      <a href="share.html">Share links</a>
      <a href="train.html">Train</a>
      <a href="#debug" onclick="document.getElementById('debug').open = true">Debug</a>
    </nav>

    <!-- Key: a quiet one-line row once saved -->
    <section class="card t-hide" id="step-key" aria-label="AI key">
      <div class="key-saved" id="key-saved" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span class="key-name" id="key-name"></span>
        <select id="model" aria-label="Model"></select>
        <button class="btn link" id="change-key" data-haptic type="button">Change</button>
      </div>
      <div id="key-edit">
        <label class="field">
          <span>API key</span>
          <input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…, sk-… or AIza…">
        </label>
        <p class="detected" id="detected"></p>
        <div class="row">
          <button class="btn primary" id="save-key" data-haptic type="button">Save</button>
          <button class="btn ghost" id="cancel-key" data-haptic type="button" hidden>Cancel</button>
          <button class="btn link quiet" id="forget-key" type="button" hidden>Forget key</button>
        </div>
      </div>
      <p class="error" id="key-error" role="alert" hidden></p>
    </section>

    <!-- Kitchen -->
    <section class="card" id="step-photos" aria-labelledby="photos-title">
      <h2 id="photos-title">Kitchen</h2>
      <div class="pickers t-hide">
        <label class="dropzone" for="photo-input">
          <input id="photo-input" type="file" accept="image/*" multiple>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
          <span class="dz-title">Photos</span>
        </label>
        <label class="dropzone" for="camera-input">
          <input id="camera-input" type="file" accept="image/*" capture="environment">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span class="dz-title">Camera</span>
        </label>
      </div>
      <ul class="thumbs t-hide" id="thumbs"></ul>
      <p class="mini t-hide" id="photo-status" aria-live="polite"></p>
      <button class="btn primary xl wide t-hide" id="scan" data-haptic type="button" disabled>Scan</button>
      <button class="btn link sample t-hide" id="use-demo" data-haptic type="button">Sample kitchen</button>
      <details class="add-dish paste-list" id="paste-list" open>
        <summary>Paste a list</summary>
        <textarea id="paste-text" rows="5" placeholder="eggs&#10;paneer, butter, protein bread&#10;air fryer&#10;&#10;or a kitchen JSON" aria-label="Kitchen items, one per line or comma-separated"></textarea>
        <button class="btn wide" id="paste-go" data-haptic type="button">Use this list</button>
      </details>
      <div id="paste-summary" hidden>
        <p class="tally-head">Spotted</p>
        <div class="tallies" id="paste-groups"></div>
        <button class="btn primary xl wide" id="paste-proceed" data-haptic type="button">Proceed</button>
        <button class="btn link quiet edit-list" id="paste-edit" data-haptic type="button">Edit list</button>
      </div>
      <p class="error" id="scan-error" role="alert" hidden></p>
    </section>

    <!-- Spotted (only after a scan; never restored on reload) -->
    <section class="card rise t-hide" id="step-inventory" aria-labelledby="inv-title" hidden>
      <div class="card-head">
        <h2 id="inv-title">Spotted</h2>
        
      </div>
      <div id="inventory-groups"></div>
      <form class="add-row" id="add-form">
        <input id="add-input" type="text" placeholder="Add" autocomplete="off" aria-label="Add an item">
        <button class="btn" type="submit" aria-label="Add">+</button>
      </form>
      <details class="basics">
        <summary>Basics</summary>
        <div class="chips" id="basics"></div>
      </details>
    </section>

    <!-- Ingredient check (?debug, 1.33.0): every listed item, used by the taste test's dishes or not, and why -->
    <section class="card rise t-hide usage" id="usage" aria-labelledby="usage-title" hidden>
      <div class="card-head"><h2 id="usage-title">Ingredient check</h2></div>
      <p class="mini" id="usage-sum"></p>
      <div class="segmented" id="usage-tabs" role="radiogroup" aria-label="Used or not">
        <button type="button" role="radio" data-haptic data-value="unused" aria-checked="true">Not used</button>
        <button type="button" role="radio" data-haptic data-value="used" aria-checked="false">Used</button>
      </div>
      <div id="usage-body"></div>
      <div class="usage-actions">
        <button class="btn" id="usage-copy" data-haptic type="button">Copy for Claude</button>
        <button class="btn" id="usage-quiz" data-haptic type="button">Taste test</button>
      </div>
    </section>

    <!-- Right now -->
    <section class="card rise" id="step-context" aria-label="Right now" hidden>
      <div class="segmented t-hide" id="kind" role="radiogroup" aria-label="Meal or snack">
        <button type="button" role="radio" data-haptic data-value="meal">Meal</button>
        <button type="button" role="radio" data-haptic data-value="snack">Snack</button>
      </div>
      <div class="ctx-grid t-hide">
        <label class="field">
          <span>When</span>
          <select id="when">
            <option value="now">Now</option>
            <option value="weekday-evening">Weekday, 7 pm</option>
            <option value="weekday-late">Weekday, 10:30 pm</option>
            <option value="weekend-lunch">Weekend, 1 pm</option>
          </select>
        </label>
        <label class="field"><span>Protein</span><span class="unit-input"><input id="t-protein" type="number" inputmode="numeric" min="0" step="5"><i>g</i></span></label>
        <label class="field"><span>Calories</span><span class="unit-input"><input id="t-calories" type="number" inputmode="numeric" min="0" step="50"><i>kcal</i></span></label>
        <label class="field"><span>Fiber</span><span class="unit-input"><input id="t-fiber" type="number" inputmode="numeric" min="0" step="1"><i>g</i></span></label>
      </div>
      <div class="group t-hide" id="soaked-wrap" hidden>
        <h3>Soaked</h3>
        <div class="chips" id="soaked"></div>
      </div>
      <button class="btn primary wide" id="decide" data-haptic type="button">What should I cook?</button>
    </section>

    <section id="result" aria-live="polite" hidden></section>

    <details class="debug t-hide" id="debug">
      <summary><span>Debug · <span id="version">1.57.0</span></span></summary>
      <div id="debug-body"></div>
      <button class="btn" id="copy-debug" type="button">Copy for Claude</button>
    </details>
    <footer class="sig"><span class="sig-me" aria-hidden="true">pranjal</span><button type="button" onclick="harveysLock()">· Lock</button></footer>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
